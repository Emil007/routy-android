org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Scopes project configuration to only what a requested task actually needs — lets
# `./gradlew :logic:test` run without configuring :app, which matters in any environment
# (like the one this project was originally scaffolded in) where the Android SDK isn't
# available: :app's com.android.application plugin fails at configuration time without one,
# but :logic has no dependency on :app and shouldn't need to touch it at all.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 (see app/build.gradle.kts's AGP version comment) turns on "built-in Kotlin support" by
# default, replacing the separate org.jetbrains.kotlin.android plugin with a different mechanism.
# Opted out here to keep the explicit Kotlin plugin declarations this project already has —
# migrating to built-in Kotlin is a bigger, separately-verifiable change, not bundled into this
# AGP-version-bump fix.
android.builtInKotlin=false

kotlin.code.style=official
