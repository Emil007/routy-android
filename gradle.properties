org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Scopes project configuration to only what a requested task actually needs — lets
# `./gradlew :logic:test` run without configuring :app, which matters in any environment
# (like the one this project was originally scaffolded in) where the Android SDK isn't
# available: :app's com.android.application plugin fails at configuration time without one,
# but :logic has no dependency on :app and shouldn't need to touch it at all.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Explicit even though AGP 9 defaults this to true — set to *false* by mistake in an earlier,
# failed fix attempt (see app/build.gradle.kts's plugins-block comment for the full story), so
# it's spelled out here now to make sure that regression can't come back silently.
android.builtInKotlin=true

kotlin.code.style=official
