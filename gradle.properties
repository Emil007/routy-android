org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# org.gradle.configureondemand=true used to be set here (Gradle's own "incubating feature"
# label, printed on every single build in this sandbox, should have been a bigger red flag
# sooner): it let `./gradlew :logic:test` run without configuring :app, which matters only in
# environments (like the one this project was originally scaffolded in) where dl.google.com is
# blocked and :app's com.android.application plugin can't even resolve. Removed after a working,
# single-module Android-Studio-generated project — same AGP/Gradle/Kotlin versions, same
# kotlin-compose-only plugin set — synced clean while routy-android kept hitting
# NoClassDefFoundError: BaseVariant regardless of matching every version exactly. Multi-module
# plus an "incubating" project-configuration-ordering feature was the one remaining structural
# difference from that verified-working baseline. To still run :logic:test in a
# dl.google.com-blocked environment now that this isn't a project default, pass it on the CLI
# instead: `./gradlew :logic:test --configure-on-demand`.

android.useAndroidX=true
android.nonTransitiveRClass=true

# Explicit even though AGP 9 defaults this to true — set to *false* by mistake in an earlier,
# failed fix attempt (see app/build.gradle.kts's plugins-block comment for the full story), so
# it's spelled out here now to make sure that regression can't come back silently.
android.builtInKotlin=true

kotlin.code.style=official
