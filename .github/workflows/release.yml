name: Release

# Pushing a version tag (e.g. `v1.2.3`) builds a signed release APK and attaches it to a new
# GitHub Release. Requires repo secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Optional repo variable DEEP_LINK_HOST for verified App Links.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Write keystore.properties
        # Read by app/build.gradle.kts's conditional signingConfig — never committed (gitignored),
        # written fresh on every run, removed again in the cleanup step below regardless of outcome.
        run: |
          cat > "${{ github.workspace }}/keystore.properties" <<PROPS
          storeFile=${{ github.workspace }}/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Print release cert SHA256 (for assetlinks.json)
        run: |
          FINGERPRINT=$(keytool -list -v \
            -keystore "${{ github.workspace }}/release.jks" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')
          echo "Release signing certificate SHA256 (paste into public/.well-known/assetlinks.json):"
          echo "$FINGERPRINT"
          {
            echo "## Release signing certificate"
            echo ""
            echo "Add this SHA256 to \`public/.well-known/assetlinks.json\` on the server for \`com.routy.app\`:"
            echo ""
            echo "\`\`\`"
            echo "$FINGERPRINT"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PdeepLinkHost=${{ vars.DEEP_LINK_HOST || 'localhost' }}

      - name: Remove keystore and credentials from the runner
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks" "${{ github.workspace }}/keystore.properties"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
