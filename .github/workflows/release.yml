name: Release

# Pushing a version tag (e.g. `v0.13a`) builds a signed release APK and attaches it to a new
# GitHub Release. Requires repo secrets ANDROID_KEYSTORE_* and optional SENTRY_DSN.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        uses: ./.github/actions/build-signed-apk
        with:
          version_name: ${{ steps.version.outputs.name }}
          version_code: ${{ steps.version.outputs.code }}
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Print release cert SHA256 (optional — HTTPS App Links only)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/release.jks"
          cat > "${GITHUB_WORKSPACE}/keystore.properties" <<PROPS
          storeFile=${GITHUB_WORKSPACE}/release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          PROPS
          FINGERPRINT=$(keytool -list -v \
            -keystore "${GITHUB_WORKSPACE}/release.jks" \
            -alias "${ANDROID_KEY_ALIAS}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' ')
          echo "Release signing certificate SHA256 (optional — only if you later enable HTTPS App Links):"
          echo "$FINGERPRINT"
          {
            echo "## Release signing certificate (optional)"
            echo ""
            echo "Beta uses \`routy://share/{token}\` only. If you add HTTPS App Links later, paste this SHA256 into \`public/.well-known/assetlinks.json\` on the server for \`com.routy.app\`:"
            echo ""
            echo "\`\`\`"
            echo "$FINGERPRINT"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "${GITHUB_WORKSPACE}/release.jks" "${GITHUB_WORKSPACE}/keystore.properties"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
