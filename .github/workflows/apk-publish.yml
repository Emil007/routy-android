name: Publish APK

# Signed release APK on every main push — mirrors routy server Docker publish.
# Download from Actions → workflow run → Artifacts. Tag pushes still use release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  apk:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from app/build.gradle.kts
        id: version
        run: |
          NAME=$(grep 'appVersionName' app/build.gradle.kts | sed -nE 's/.*\?: "([^"]+)".*/\1/p' | head -1)
          if [ -z "$NAME" ]; then
            echo "Could not parse default versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        uses: ./.github/actions/build-signed-apk
        with:
          version_name: ${{ steps.version.outputs.name }}
          version_code: ${{ steps.version.outputs.code }}
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routy-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
