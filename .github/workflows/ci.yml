name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Doesn't strictly need :app's Android SDK/plugin to resolve, but no longer avoids configuring
  # it either (see gradle.properties for why org.gradle.configureondemand was removed) — harmless
  # here since ubuntu-latest ships both a real SDK and full internet access, unlike this
  # project's own dev sandbox, which can only run this specific task with
  # `--configure-on-demand` passed explicitly on the CLI.
  logic-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: logic module unit tests
        run: ./gradlew :logic:test

  # Needs a real Android SDK — unlike this repo's own dev sandbox, GitHub-hosted ubuntu-latest
  # runners ship one preinstalled and pre-licensed, so no extra setup-android step is needed.
  # This is the actual first compiler check the :app module gets — see NOTES.md.
  app-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      - name: Android Lint
        run: ./gradlew :app:lintDebug
